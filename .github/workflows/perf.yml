name: Performance

# measures the built app on each system and puts the numbers side by side in the summary of the run (scripts/perf-summary.js)
# pr-checks.yml runs it for pull requests but leaves it out of required-checks, so a slow or noisy runner does not stop a pull request: the numbers are there to be read
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  perf:
    name: Perf (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: ./.github/actions/install-dependencies
      - run: npm run build
      # the same library on every system, so the numbers compare
      - name: Measure
        env:
          PERF_TRACKS: 3000
        run: npm run perf
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: perf-${{ matrix.os }}
          # the numbers, and the traces of a measurement that failed
          path: test-results
          if-no-files-found: ignore

  summary:
    name: Compare the systems
    needs: perf
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: perf-*
          path: perf-results
      - name: Summary of the systems
        run: node scripts/perf-summary.js perf-results | tee -a "$GITHUB_STEP_SUMMARY"
