name: Performance

# measures the built app on each system and puts the numbers side by side in the summary of the run (scripts/checks/perf-summary.js)
# pr-checks.yml runs it for pull requests but leaves it out of required-checks, so a slow or noisy runner does not stop a pull request: the numbers are there to be read
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # the scenarios play the generated FLAC albums, which the ffmpeg of the app decodes (docs/app/decoder-proxy.md); its build is cached
  ffmpeg:
    uses: ./.github/workflows/ffmpeg.yml
    permissions:
      # the planning job of ffmpeg.yml lists the caches
      actions: read
      contents: read

  perf:
    name: Perf (${{ matrix.os }})
    needs: ffmpeg
    runs-on: ${{ matrix.os }}
    # the base branch is built and measured too, three times each: Windows scans slowly
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux, arch: x64 }
          - { os: macos-15, platform: macos, arch: arm64 }
          - { os: windows-2025, platform: windows, arch: x64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: ./.github/actions/install-dependencies
      - uses: ./.github/actions/restore-ffmpeg
        with:
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}
      - run: npm run build
      # the base branch is built in a folder of its own and measured first, by the scenarios of this checkout (PERF_APP_OUT points the app of the tests at its build), so the two numbers come from the same runner and the same scenarios
      - name: Check out the base branch
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - name: Build the base branch
        if: github.event_name == 'pull_request'
        working-directory: base
        run: |
          npm ci
          npm run build
      # the app of the base branch looks for the ffmpeg next to its own build (a base that decodes FLAC needs it)
      - name: Give the base branch the ffmpeg
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          mkdir -p base/.cache
          cp -R .cache/ffmpeg base/.cache/
      # the same library on every system, so the numbers compare
      - name: Measure the base branch
        if: github.event_name == 'pull_request'
        env:
          # the numbers are of the app with a GPU (the bars, the translucent window), as a runner draws by the CPU and the app would take its motion away. See docs/app/software-rendering.md
          TUNELLE_GPU: 1
          PERF_TRACKS: 3000
          # a run of a runner differs by tens of percent on its own: the summary takes the median of three
          PERF_REPEAT: 3
          PERF_APP_OUT: ${{ github.workspace }}/base/out
        run: npm run perf
      # the next run empties test-results
      - name: Keep the numbers of the base branch
        if: github.event_name == 'pull_request' && !cancelled()
        shell: bash
        run: '[ ! -d test-results ] || mv test-results base-test-results'
      - name: Measure
        if: ${{ !cancelled() }}
        env:
          # the numbers are of the app with a GPU (the bars, the translucent window), as a runner draws by the CPU and the app would take its motion away. See docs/app/software-rendering.md
          TUNELLE_GPU: 1
          PERF_TRACKS: 3000
          # a run of a runner differs by tens of percent on its own: the summary takes the median of three
          PERF_REPEAT: 3
        run: npm run perf
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: perf-${{ matrix.os }}
          # the numbers, and the traces of a measurement that failed
          path: test-results
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'pull_request' && !cancelled()
        with:
          name: base-perf-${{ matrix.os }}
          path: base-test-results
          if-no-files-found: ignore

  summary:
    name: Compare the systems
    needs: perf
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*perf-*'
          path: perf-results
      - name: Summary of the systems
        run: node scripts/checks/perf-summary.js perf-results | tee -a "$GITHUB_STEP_SUMMARY"
