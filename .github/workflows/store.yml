name: Store submission

# Sends a release to the Microsoft Store as a new submission, after every release, weekly and by hand
# See docs/release/microsoft-store.md
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      commit:
        type: boolean
        default: true
      automatic:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      tag:
        description: The tag of the release to submit, for example v26.10.14
        type: string
        required: true
      commit:
        description: Submit it for certification, otherwise only a draft is made (look at it in Partner Center, do not change it there)
        type: boolean
        default: false
  # the latest release, after the releases of Monday and Thursday have had time to pass certification
  schedule:
    - cron: '0 8 * * 3'

permissions:
  contents: read

# the Store keeps one submission in progress per app
concurrency:
  group: microsoft-store
  cancel-in-progress: false

jobs:
  submit:
    name: Submit to the Microsoft Store
    runs-on: windows-2025
    timeout-minutes: 30
    environment: microsoft-store
    env:
      PRODUCT_ID: ${{ vars.MS_STORE_PRODUCT_ID }}
      # empty in a scheduled run: the latest release
      REQUESTED_TAG: ${{ inputs.tag }}
      COMMIT: ${{ github.event_name == 'schedule' || inputs.commit }}
      AUTOMATIC: ${{ github.event_name == 'schedule' || inputs.automatic }}
      # the same text for every version: the changes are listed on the releases of GitHub
      RELEASE_NOTES: Bug fixes and improvements. The changes of every version are listed at https://github.com/Koeroesi86/tunelle/releases
      # a listing in another language than English has its own text (the listing of a language that is added needs a line here, or shows the English text)
      RELEASE_NOTES_HU: "Hibajavítások és fejlesztések. Az egyes verziók változásai itt olvashatók: https://github.com/Koeroesi86/tunelle/releases"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Find the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${REQUESTED_TAG:-$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)}"
          # it goes into the environment of the next steps: nothing but a tag of a release
          [[ "$tag" =~ ^v[0-9]{2}\.([1-9]|1[0-2])\.[0-9]+$ ]] || { echo "$tag is not a release tag like v26.10.14"; exit 1; }
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: Install the Microsoft Store developer CLI
        uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4
        with:
          version: v0.4.3
      - name: Sign in to Partner Center
        env:
          TENANT_ID: ${{ secrets.MS_STORE_TENANT_ID }}
          SELLER_ID: ${{ secrets.MS_STORE_SELLER_ID }}
          CLIENT_ID: ${{ secrets.MS_STORE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.MS_STORE_CLIENT_SECRET }}
        shell: pwsh
        run: |
          msstore reconfigure --tenantId $env:TENANT_ID --sellerId $env:SELLER_ID --clientId $env:CLIENT_ID --clientSecret $env:CLIENT_SECRET
          if ($LASTEXITCODE -ne 0) { throw "msstore reconfigure failed with $LASTEXITCODE" }
      - name: Read the last submission
        shell: pwsh
        run: |
          # 2>&1: msstore writes its progress text to stderr, which a pipe does not take
          msstore submission status $env:PRODUCT_ID 2>&1 | ForEach-Object { "$_" } | Tee-Object -FilePath status.txt
          if ($LASTEXITCODE -ne 0) { throw "msstore submission status failed with $LASTEXITCODE" }
          msstore submission get $env:PRODUCT_ID 2>&1 | ForEach-Object { "$_" } | Tee-Object -FilePath store.json
          if ($LASTEXITCODE -ne 0) { throw "msstore submission get failed with $LASTEXITCODE" }
      # a submission in certification (or failed and still there) blocks the next one: nothing here cancels or deletes it
      - name: Decide whether the release is submitted now
        id: decide
        shell: pwsh
        run: |
          node scripts/release/store-submission.js decide status.txt store.json $env:TAG $env:AUTOMATIC
          if ($LASTEXITCODE -ne 0) { throw 'The release can not go to the Store' }
      - name: Download the packages of the release
        if: steps.decide.outputs.submit == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'Tunelle-*.appx' --dir packages
      - name: Check the packages
        if: steps.decide.outputs.submit == 'true'
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $packages = Get-ChildItem packages/*.appx
          if ($packages.Count -ne 2) { throw "Expected the x64 and the arm64 package, found $($packages.Count): $($packages.Name -join ', ')" }
          $versions = $packages | ForEach-Object {
            $archive = [System.IO.Compression.ZipFile]::OpenRead($_.FullName)
            $reader = [System.IO.StreamReader]::new($archive.GetEntry('AppxManifest.xml').Open())
            ([xml]$reader.ReadToEnd()).Package.Identity.Version
            $reader.Dispose()
            $archive.Dispose()
          }
          node scripts/release/store-submission.js check $env:TAG store.json @versions
          if ($LASTEXITCODE -ne 0) { throw 'The release can not go to the Store' }
      - name: Bundle the packages
        if: steps.decide.outputs.submit == 'true'
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" | Sort-Object FullName | Select-Object -Last 1
          New-Item -ItemType Directory -Path bundle | Out-Null
          & $makeappx.FullName bundle /d packages /p "bundle\Tunelle-$version.msixbundle" /bv "$version.0"
          if ($LASTEXITCODE -ne 0) { throw "makeappx failed with $LASTEXITCODE" }
      # always without commit: the notes are set on the draft before it is submitted
      - name: Make the draft
        if: steps.decide.outputs.submit == 'true'
        shell: pwsh
        run: |
          $bundle = (Get-ChildItem bundle/*.msixbundle).FullName
          msstore publish $bundle --appId $env:PRODUCT_ID --noCommit
          if ($LASTEXITCODE -ne 0) { throw "msstore publish failed with $LASTEXITCODE" }
      # the draft is a copy of the last published submission, with its "What's new" text; updateMetadata replaces the whole submission, so the draft is read and sent back with the notes changed
      - name: Set the release notes of the draft
        if: steps.decide.outputs.submit == 'true'
        shell: pwsh
        run: |
          msstore submission get $env:PRODUCT_ID 2>&1 | ForEach-Object { "$_" } | Tee-Object -FilePath draft.json
          if ($LASTEXITCODE -ne 0) { throw "msstore submission get failed with $LASTEXITCODE" }
          node scripts/release/store-submission.js notes draft.json metadata.json $env:RELEASE_NOTES "hu=$env:RELEASE_NOTES_HU"
          if ($LASTEXITCODE -ne 0) { throw 'The release notes could not be put into the draft' }
          msstore submission updateMetadata $env:PRODUCT_ID metadata.json
          if ($LASTEXITCODE -ne 0) { throw "msstore submission updateMetadata failed with $LASTEXITCODE" }
      - name: Submit the draft for certification
        if: steps.decide.outputs.submit == 'true' && env.COMMIT == 'true'
        shell: pwsh
        run: |
          msstore submission publish $env:PRODUCT_ID
          if ($LASTEXITCODE -ne 0) { throw "msstore submission publish failed with $LASTEXITCODE" }
      - name: Say what was submitted
        if: steps.decide.outputs.submit == 'true'
        shell: pwsh
        run: |
          $state = if ($env:COMMIT -eq 'true') { 'Submitted for certification, which runs on the side of Microsoft.' } else { 'A draft was made and is not submitted. Look at it in Partner Center but do not change it there (a submission made through the API is changed only through the API). To submit: delete the draft in Partner Center and run this workflow again with commit ticked.' }
          $lines = @(
            "## $env:TAG in the Microsoft Store",
            '',
            $state,
            '',
            "- Packages: $((Get-ChildItem packages/*.appx).Name -join ', ')",
            "- Submission: https://partner.microsoft.com/dashboard/products/$env:PRODUCT_ID/overview"
          )
          $lines | Add-Content -Path $env:GITHUB_STEP_SUMMARY
      - name: Say why nothing was submitted
        if: steps.decide.outputs.submit == 'false'
        env:
          REASON: ${{ steps.decide.outputs.reason }}
        shell: pwsh
        run: |
          @("## $env:TAG was not submitted to the Microsoft Store", '', $env:REASON) | Add-Content -Path $env:GITHUB_STEP_SUMMARY
