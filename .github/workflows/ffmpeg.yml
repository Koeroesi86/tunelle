name: ffmpeg

# Builds the decode-only LGPL ffmpeg of #302 from the pinned source (scripts/ffmpeg/ffmpeg-source.json); the binary is an artifact, nothing ships it yet.
# See docs/development/ffmpeg-build.md.
on:
  pull_request:
    paths:
      - scripts/ffmpeg/**
      - .github/workflows/ffmpeg.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-22.04 }
          - { name: linux-arm64, os: ubuntu-22.04-arm }
          - { name: macos-arm64, os: macos-latest }
          - { name: macos-x64, os: macos-15-intel }
          - { name: windows-x64, os: windows-2025 }
    defaults:
      run:
        shell: ${{ startsWith(matrix.os, 'windows') && 'msys2 {0}' || 'bash' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@e9898307ac31d1a803454791be09ab9973336e1c # v2.31.1
        if: startsWith(matrix.os, 'windows')
        with:
          msystem: UCRT64
          path-type: inherit
          install: make nasm diffutils xz tar
          pacboy: gcc:p
      - if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y nasm
      - if: startsWith(matrix.os, 'macos')
        run: brew install nasm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node scripts/ffmpeg/ffmpeg-build.js "$RUNNER_TEMP/ffmpeg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ffmpeg-${{ matrix.name }}
          path: ${{ runner.temp }}/ffmpeg/install/bin/
          retention-days: 7
