name: ffmpeg

# Builds the decode-only LGPL ffmpeg of #302 from the pinned source (scripts/ffmpeg/ffmpeg-source.json); dist.yml packages the artifact of each system.
# The build is kept in a cache keyed on the system, the source and the build script; the jobs that need the binary restore it from there
# (.github/actions/restore-ffmpeg), and only a system whose cache is missing is built. See docs/development/ffmpeg-build.md.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # names the systems whose build is not in the cache yet, on one cheap runner, so a run with every build cached starts no macOS or Windows runner at all
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # gh cache list
      actions: read
      contents: read
    outputs:
      missing: ${{ steps.plan.outputs.missing }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Find the systems without a cached build
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          HASH: ${{ hashFiles('scripts/ffmpeg/ffmpeg-source.json', 'scripts/ffmpeg/ffmpeg-build.js') }}
          REF: ${{ github.ref }}
          DEFAULT_REF: refs/heads/${{ github.event.repository.default_branch }}
        # the AppImage runs on Ubuntu 22.04, so the Linux build is made there (see dist.yml); platform and arch are the ones of process.platform and process.arch
        # a cache is read from the ref of the run and from the default branch; a failed lookup counts as missing, so the build runs
        run: |
          matrix='[
            {"platform":"linux","arch":"x64","os":"ubuntu-22.04"},
            {"platform":"linux","arch":"arm64","os":"ubuntu-22.04-arm"},
            {"platform":"darwin","arch":"arm64","os":"macos-15"},
            {"platform":"darwin","arch":"x64","os":"macos-15-intel"},
            {"platform":"win32","arch":"x64","os":"windows-2025"},
            {"platform":"win32","arch":"arm64","os":"windows-11-arm"}
          ]'
          missing='[]'
          for entry in $(jq -c '.[]' <<< "$matrix"); do
            key="ffmpeg-$(jq -r '"\(.platform)-\(.arch)"' <<< "$entry")-$HASH"
            found=$(gh cache list --repo "$GITHUB_REPOSITORY" --key "$key" --json key,ref \
              --jq "map(select(.key == \"$key\" and (.ref == \"$REF\" or .ref == \"$DEFAULT_REF\"))) | length" || echo 0)
            [ "$found" != "0" ] || missing=$(jq -c ". + [$entry]" <<< "$missing")
          done
          echo "missing=$missing" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.platform }} ${{ matrix.arch }})
    needs: plan
    if: needs.plan.outputs.missing != '[]'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.missing) }}
    defaults:
      run:
        shell: ${{ startsWith(matrix.os, 'windows') && 'msys2 {0}' || 'bash' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: ${{ runner.temp }}/ffmpeg/install
          key: ffmpeg-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('scripts/ffmpeg/ffmpeg-source.json', 'scripts/ffmpeg/ffmpeg-build.js') }}
      # the source tarball is kept apart from the build, so a change of the build script or the flags does not download it again
      - name: Read the pinned sha256
        id: pin
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: echo "sha256=$(node -p "require('./scripts/ffmpeg/ffmpeg-source.json').sha256")" >> "$GITHUB_OUTPUT"
      - name: Restore the source tarball
        id: tarball
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ffmpeg-source
          key: ffmpeg-source-${{ matrix.os }}-${{ steps.pin.outputs.sha256 }}
      - uses: msys2/setup-msys2@e9898307ac31d1a803454791be09ab9973336e1c # v2.31.1
        if: steps.cache.outputs.cache-hit != 'true' && matrix.platform == 'win32' && matrix.arch == 'x64'
        with:
          msystem: UCRT64
          path-type: inherit
          install: make nasm diffutils xz tar
          pacboy: gcc:p
      # the arm64 build uses clang, which the packages of MSYS2 for that processor provide (scripts/ffmpeg/ffmpeg-build.js passes --cc=clang); the assembly is not assembled by nasm there
      - uses: msys2/setup-msys2@e9898307ac31d1a803454791be09ab9973336e1c # v2.31.1
        if: steps.cache.outputs.cache-hit != 'true' && matrix.platform == 'win32' && matrix.arch == 'arm64'
        with:
          msystem: CLANGARM64
          path-type: inherit
          install: make diffutils xz tar
          pacboy: clang:p
      - if: steps.cache.outputs.cache-hit != 'true' && startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y nasm
      - if: steps.cache.outputs.cache-hit != 'true' && startsWith(matrix.os, 'macos')
        run: brew install nasm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - if: steps.cache.outputs.cache-hit != 'true'
        run: node scripts/ffmpeg/ffmpeg-build.js "$RUNNER_TEMP/ffmpeg" "$RUNNER_TEMP/ffmpeg-source"
      # saved when the build fails too: the tarball is checked before it is kept, and the next run needs no download
      - name: Keep the source tarball
        if: always() && steps.cache.outputs.cache-hit != 'true' && steps.tarball.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ffmpeg-source
          key: ffmpeg-source-${{ matrix.os }}-${{ steps.pin.outputs.sha256 }}
