name: Release

# Twice a week (Monday and Thursday) and by hand, from master only. A scheduled run releases only when the app changed since the latest release
# (documentation, the website and the files of the repository tooling do not count), a manual run always does. The release is published, as the updater
# of the installed apps only sees published releases, and its tag is the version that was stamped into the package (scripts/version.js).
on:
  schedule:
    - cron: '0 6 * * 1,4'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # the tags of the releases are compared with the checked out commit
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Plan the release
        id: plan
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # only the tags of the releases of this scheme, not the old ones (v0.2.4-alpha, 1.0.0-linux, ...)
          latest=$(git tag --list --sort=-version:refname | grep -E '^v[0-9]{2}\.([1-9]|1[0-2])\.[0-9]+$' | head -n 1 || true)
          if [ "$EVENT" = schedule ] && [ -n "$latest" ] && git diff --quiet "$latest" HEAD -- . ':(exclude)*.md' ':(exclude).github' ':(exclude).claude' ':(exclude)site'; then
            echo "Nothing changed since ${latest}"
            echo 'release=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'release=true' >> "$GITHUB_OUTPUT"
          # fails when the run number restarted and the version is not greater than the latest release
          echo "version=$(node scripts/version.js --after "$latest")" | tee -a "$GITHUB_OUTPUT"

  test:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    uses: ./.github/workflows/test.yml

  dist:
    needs: [plan, test]
    uses: ./.github/workflows/dist.yml
    with:
      version: ${{ needs.plan.outputs.version }}

  release:
    needs: [plan, dist]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # before the download: the checkout cleans the workspace, which removed the downloaded artifacts and failed the release of 26 October
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # not the coverage report of the test job
          pattern: dist-*
          path: artifacts
      # windows and macOS write one update file for both architectures from separate runners: one list of files for electron-updater to choose from
      - name: Merge the artifacts of the runners
        run: node scripts/merge-update-files.js artifacts dist
      # the update files have to name the version of the release, or the updater of a platform compares against another one
      - name: Check the version of the update files
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          ls dist
          for file in dist/latest*.yml; do
            grep -qx "version: ${VERSION}" "$file" || { echo "$file does not have version ${VERSION}"; exit 1; }
          done
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ needs.plan.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          # the Store packages are in the release for the upload to Partner Center, the Store installs and updates them
          body: |
            The `.appx` files are the packages for the Microsoft Store. They are not signed and not meant to be installed from here: use the installer.
          files: dist/*

  # the website shows the version and the installers of the release that was just published
  site:
    needs: release
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
