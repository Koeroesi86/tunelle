name: Test

# lint, dead code and types (once), unit tests with coverage, the integration tests, the end to end tests of the built app and the Electron security scan, used by the workflows that package the app
on:
  workflow_call:

permissions:
  contents: read

jobs:
  # the end to end tests play what the ffmpeg of the app decodes (docs/app/decoder-proxy.md); its build is cached, so this only builds when the source changed
  ffmpeg:
    uses: ./.github/workflows/ffmpeg.yml
    permissions:
      # the planning job of ffmpeg.yml lists the caches
      actions: read
      contents: read

  # the checks that do not depend on the system run once; the system jobs start at the same time, as waiting for these would add their duration to every run
  static:
    name: Lint, dead code, types and security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: ./.github/actions/install-dependencies
      # the transformed modules of Vitest and the results of ESLint, kept between runs (docs/development/ci.md)
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/eslint
          key: eslint-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: eslint-${{ hashFiles('package-lock.json') }}-
      - run: npm run lint
      - run: npm run fallow
      - run: npm run typecheck
      - name: Electron security scan
        run: npm run security:electron

  test:
    name: Test (${{ matrix.os }})
    needs: ffmpeg
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # platform and arch are the ones of process.platform and process.arch, which name the cached ffmpeg
        include:
          - { os: ubuntu-latest, platform: linux, arch: x64 }
          - { os: ubuntu-24.04-arm, platform: linux, arch: arm64 }
          - { os: ubuntu-22.04, platform: linux, arch: x64 }
          - { os: ubuntu-22.04-arm, platform: linux, arch: arm64 }
          - { os: macos-15-intel, platform: darwin, arch: x64 }
          - { os: macos-15, platform: darwin, arch: arm64 }
          - { os: windows-2025, platform: win32, arch: x64 }
          - { os: windows-11-arm, platform: win32, arch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # the prebuilt sqlite3 is linked against glibc 2.38, Ubuntu 22.04 has 2.35
      - name: Compile the native modules
        if: startsWith(matrix.os, 'ubuntu-22.04')
        run: echo "npm_config_build_from_source=true" >> "$GITHUB_ENV"
      - uses: ./.github/actions/install-dependencies
      # the transformed modules of Vitest, kept between runs (docs/development/ci.md)
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/vitest
          key: vitest-${{ matrix.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: vitest-${{ matrix.os }}-${{ hashFiles('package-lock.json') }}-
      # the files Flathub takes the app from (packaging/flatpak/) and the desktop file of the AppImage (packaging/appimage/) are checked with the tools it uses
      # the downloads of apt are kept between runs, and the first try skips the update of the package lists, which needs the mirror (the runner could not resolve it at times)
      - name: Restore the validation tools
        if: matrix.os == 'ubuntu-latest'
        id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-validate-${{ github.run_id }}
          restore-keys: apt-validate-
      # apt could not resolve the Ubuntu mirrors on some runners; the resolver is shown, and public ones are added when the lookup fails (docs/development/ci.md)
      - name: Check the DNS of apt
        if: matrix.os == 'ubuntu-latest'
        run: |
          resolvectl status 2>&1 | head -20 || true
          if getent hosts archive.ubuntu.com security.ubuntu.com; then exit 0; fi
          echo '::warning::The Ubuntu mirrors do not resolve, adding public DNS servers'
          sudo mkdir -p /etc/systemd/resolved.conf.d
          printf '[Resolve]\nDNS=1.1.1.1 8.8.8.8 9.9.9.9\n' | sudo tee /etc/systemd/resolved.conf.d/fallback.conf
          sudo systemctl restart systemd-resolved || printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' | sudo tee -a /etc/resolv.conf
          getent hosts archive.ubuntu.com security.ubuntu.com
      - name: Install the validation tools
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 15
        run: |
          mkdir -p ~/apt-archives/partial
          install() { sudo timeout 10m apt-get install -y -o Acquire::Retries=3 -o Dir::Cache::archives="$HOME/apt-archives" appstream desktop-file-utils; }
          install || { sudo timeout 10m apt-get update && install; }
          sudo chown -R "$USER" ~/apt-archives
      - name: Keep the validation tools
        if: always() && matrix.os == 'ubuntu-latest' && steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-validate-${{ github.run_id }}
      - name: Validate the Flatpak metadata
        if: matrix.os == 'ubuntu-latest'
        run: |
          appstreamcli validate --no-net packaging/flatpak/*.metainfo.xml
          desktop-file-validate packaging/flatpak/*.desktop packaging/appimage/*.desktop
      - uses: ./.github/actions/restore-ffmpeg
        with:
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}
      - run: npm run test:coverage
      # real SQLite, real files and the real ffmpeg of this system, without Electron (docs/development/integration-tests.md)
      - name: Integration tests
        timeout-minutes: 10
        run: npm run test:integration
      # the built app is started and driven (e2e/); the audio goes to a sink that plays nothing (--disable-audio-output), so the runners need no sound device, and Linux draws the window headless
      - run: npm run build
      - name: End to end tests
        timeout-minutes: 20
        run: npm run test:e2e
      - name: Coverage summary
        if: matrix.os == 'ubuntu-latest' && !cancelled()
        run: |
          {
            echo '### Coverage'
            node -e "const { total } = require('./coverage/coverage-summary.json'); Object.entries(total).forEach(([name, { pct }]) => console.log('- ' + name + ': ' + pct + '%'))"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.os == 'ubuntu-latest' && !cancelled()
        with:
          name: coverage
          path: coverage/lcov-report
          if-no-files-found: ignore
      # the report has the steps, the screenshots and the traces of the tests that failed
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: e2e-report-${{ matrix.os }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  # axe (docs/development/accessibility.md): on Linux only and beside the other jobs, so the end to end tests of every system stay as short as they are
  accessibility:
    name: Accessibility (axe)
    needs: ffmpeg
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: ./.github/actions/install-dependencies
      - uses: ./.github/actions/restore-ffmpeg
        with:
          platform: linux
          arch: x64
      - run: npm run build
      - name: Accessibility checks
        run: npm run test:a11y
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: a11y-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
