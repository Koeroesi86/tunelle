name: Test

# lint, dead code and types (once), unit tests with coverage, the end to end tests of the built app and the Electron security scan, used by the workflows that package the app
on:
  workflow_call:

permissions:
  contents: read

jobs:
  # the checks that do not depend on the system run once, so a mistake fails here and not on six runners
  static:
    name: Lint, dead code, types and security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: ./.github/actions/install-dependencies
      - run: npm run lint
      - run: npm run fallow
      - run: npm run typecheck
      - name: Electron security scan
        run: npm run security:electron

  test:
    name: Test (${{ matrix.os }})
    needs: static
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, ubuntu-22.04, ubuntu-22.04-arm, macos-15-intel, macos-15, windows-2025, windows-11-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # the prebuilt sqlite3 is linked against glibc 2.38, Ubuntu 22.04 has 2.35
      - name: Compile the native modules
        if: startsWith(matrix.os, 'ubuntu-22.04')
        run: echo "npm_config_build_from_source=true" >> "$GITHUB_ENV"
      - uses: ./.github/actions/install-dependencies
      # the files Flathub takes the app from (flatpak/) and the desktop file of the AppImage (appimage/) are checked with the tools it uses
      - name: Validate the Flatpak metadata
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get install -y appstream desktop-file-utils
          appstreamcli validate --no-net flatpak/*.metainfo.xml
          desktop-file-validate flatpak/*.desktop appimage/*.desktop
      - run: npm run test:coverage
      # the built app is started and driven (e2e/); the audio goes to a sink that plays nothing (--disable-audio-output), so the runners need no sound device, and Linux draws the window headless
      - run: npm run build
      - name: End to end tests
        timeout-minutes: 20
        run: npm run test:e2e
      - name: Coverage summary
        if: matrix.os == 'ubuntu-latest' && !cancelled()
        run: |
          {
            echo '### Coverage'
            node -e "const { total } = require('./coverage/coverage-summary.json'); Object.entries(total).forEach(([name, { pct }]) => console.log('- ' + name + ': ' + pct + '%'))"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.os == 'ubuntu-latest' && !cancelled()
        with:
          name: coverage
          path: coverage/lcov-report
          if-no-files-found: ignore
      # the report has the steps, the screenshots and the traces of the tests that failed
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: e2e-report-${{ matrix.os }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
