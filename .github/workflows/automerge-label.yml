name: Automerge label

# A pull request of a stack cannot get auto-merge while its base is another pull request. The automerge label asks for squash auto-merge, and this turns it on
# once for the labeled pull requests to master and takes the label off, when the label is added, when the base becomes master, when master moves and when checks end
# (scripts/release/automerge-label.js). See docs/release/releases.md
on:
  push:
    branches: [master]
  # pull_request_target has the secret, and nothing of a pull request is checked out or run: the script only calls the API
  pull_request_target:
    types: [opened, reopened, ready_for_review, labeled, edited]
    branches: [master]
  workflow_run:
    workflows: [Pull request checks]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automerge-label
  cancel-in-progress: false

jobs:
  automerge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # GH_REBASE_TOKEN, not GITHUB_TOKEN: auto-merge turned on with GITHUB_TOKEN starts no rebase-auto-merge.yml run
      - run: node scripts/release/automerge-label.js
        env:
          GH_TOKEN: ${{ secrets.GH_REBASE_TOKEN }}
