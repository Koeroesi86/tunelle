name: Store certification

# The Windows App Certification Kit (the tests that Partner Center runs on a package) on the x64 package of a release, so a problem shows before the
# submission, and a run of the installed package that shows it does not look for updates on GitHub. It runs on the package of the latest release, or of the tag it is given (by hand, or by release.yml after a release), and when this file or
# its parser changes. The package is unsigned, so a copy of it is signed with a certificate made for the run, which the kit needs to install it; the
# package that is uploaded to the Store is the one of the release.
on:
  pull_request:
    paths:
      - .github/workflows/wack.yml
      - scripts/wack-report.js
  workflow_call:
    inputs:
      tag:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      tag:
        description: The tag of the release to check, empty for the latest
        type: string
        default: ''

permissions:
  contents: read

jobs:
  wack:
    name: Windows App Certification Kit (x64)
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Download the package of the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: gh release download ${TAG:+"$TAG"} --repo "$GITHUB_REPOSITORY" --pattern 'Tunelle-*-x64.appx' --dir package
      # Windows installs a package only when it is signed with a certificate it trusts, and the publisher of the certificate has to be the one of the manifest
      - name: Sign a copy of the package with a certificate of this run
        shell: pwsh
        run: |
          $package = (Get-ChildItem package/*.appx).FullName
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($package)
          $reader = [System.IO.StreamReader]::new($archive.GetEntry('AppxManifest.xml').Open())
          $publisher = ([xml]$reader.ReadToEnd()).Package.Identity.Publisher
          $reader.Dispose()
          $archive.Dispose()
          Write-Host "Publisher: $publisher"

          $password = ConvertTo-SecureString -String ([guid]::NewGuid().ToString()) -AsPlainText -Force
          $certificate = New-SelfSignedCertificate -Type Custom -Subject $publisher -KeyUsage DigitalSignature -FriendlyName 'Tunelle certification' -CertStoreLocation Cert:\CurrentUser\My -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          Export-Certificate -Cert $certificate -FilePath "$env:RUNNER_TEMP\tunelle.cer" | Out-Null
          Import-Certificate -FilePath "$env:RUNNER_TEMP\tunelle.cer" -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          Export-PfxCertificate -Cert $certificate -FilePath "$env:RUNNER_TEMP\tunelle.pfx" -Password $password | Out-Null

          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          & $signtool.FullName sign /fd SHA256 /f "$env:RUNNER_TEMP\tunelle.pfx" /p ([System.Net.NetworkCredential]::new('', $password).Password) $package
          if ($LASTEXITCODE -ne 0) { throw "signtool failed with $LASTEXITCODE" }
      - name: Run the Windows App Certification Kit
        shell: pwsh
        run: |
          $kit = "${env:ProgramFiles(x86)}\Windows Kits\10\App Certification Kit\appcert.exe"
          if (-not (Test-Path $kit)) { throw "The kit is not on the runner: $kit" }
          $package = (Get-ChildItem package/*.appx).FullName
          & $kit reset
          & $kit test -appxpackagepath $package -reportoutputpath "$env:RUNNER_TEMP\wack-report.xml"
          Write-Host "appcert exit code: $LASTEXITCODE"
          Copy-Item "$env:RUNNER_TEMP\wack-report.xml" wack-report.xml
      - name: Read the report
        run: node scripts/wack-report.js wack-report.xml
      # the Store brings the updates: the installed package must not look for a release on GitHub, which an app started from the Start menu does
      # unless process.windowsStore is true. GitHub is sent to a listener of this machine, and nothing may connect to it while the package runs
      - name: Install the package and watch for requests to GitHub
        shell: pwsh
        run: |
          Add-AppxPackage -Path (Get-ChildItem package/*.appx).FullName
          $hosts = 'github.com', 'api.github.com', 'objects.githubusercontent.com', 'github-releases.githubusercontent.com', 'release-assets.githubusercontent.com'
          $lines = $hosts | ForEach-Object { "127.0.0.1 $_"; "::1 $_" }
          Add-Content -Path "$env:SystemRoot\System32\drivers\etc\hosts" -Value $lines
          ipconfig /flushdns | Out-Null
          node scripts/watch-github.js 45 pwsh -NoProfile -File scripts/launch-store-package.ps1
          if ($LASTEXITCODE -ne 0) { throw 'GitHub was contacted, or the check did not work' }
          # a package that did not start would pass the check for the wrong reason
          if (-not (Get-Process -Name Tunelle -ErrorAction SilentlyContinue)) { throw 'The package is not running' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: wack-report
          path: wack-report.xml
          if-no-files-found: ignore
