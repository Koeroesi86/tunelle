name: Dist

# builds and packages the app on every operating system, used by the workflows that check or release it
on:
  workflow_call:
    inputs:
      # the version of a release (see scripts/release/version.js), stamped into package.json before packaging; empty keeps the one of package.json
      version:
        type: string
        default: ''
      # the summary of the release as JSON ({"en": ..., "hu": ...}), put into the metainfo of the Flatpak with the version; empty is the generic text
      notes:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  # the decode-only ffmpeg of every system (docs/development/ffmpeg-build.md); the build is cached, so it runs when the source or the build script changed
  ffmpeg:
    uses: ./.github/workflows/ffmpeg.yml
    permissions:
      contents: read

  dist:
    needs: ffmpeg
    name: Dist (${{ matrix.platform }} ${{ matrix.arch }}${{ matrix.package && format(' {0}', matrix.package) || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # the AppImage is built on the oldest Ubuntu LTS the AppImage catalogues test on (appimage.github.io runs it there): a native module built
          # on a newer one needs a newer glibc than that (npm run check:dist fails on a symbol above 2.35); the Flatpak is built on the latest
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            package: appimage
          - os: ubuntu-22.04-arm
            platform: linux
            arch: arm64
            package: appimage
          - os: ubuntu-latest
            platform: linux
            arch: x64
            package: flatpak
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            package: flatpak
          - os: macos-15-intel
            platform: darwin
            arch: x64
          - os: macos-15
            platform: darwin
            arch: arm64
          - os: windows-2025
            platform: win32
            arch: x64
          - os: windows-11-arm
            platform: win32
            arch: arm64
    env:
      # which Linux package the job builds (scripts/release/dist.js, scripts/release/check-dist.js); empty on the other systems
      TUNELLE_LINUX_PACKAGE: ${{ matrix.package }}
      # names the caches and the artifact of the job: a system has a job for each Linux package
      DIST_ID: ${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.package && format('-{0}', matrix.package) || '' }}
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.package && format('-{0}', matrix.package) || '' }}/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.package && format('-{0}', matrix.package) || '' }}/electron-builder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/${{ env.DIST_ID }}
            ~/.electron-gyp
          key: build-${{ env.DIST_ID }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            build-${{ env.DIST_ID }}-${{ hashFiles('package-lock.json') }}-
            build-${{ env.DIST_ID }}-
      # the downloads of apt are kept between runs; the first try skips the update of the package lists, which needs the mirror, and falls back to it when a package is gone from there
      - name: Restore the packaging tools
        if: matrix.package == 'flatpak'
        id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-flatpak-${{ matrix.arch }}-${{ github.run_id }}
          restore-keys: apt-flatpak-${{ matrix.arch }}-
      - name: Install Linux packaging tools
        if: matrix.package == 'flatpak'
        timeout-minutes: 15
        run: |
          mkdir -p ~/apt-archives/partial
          install() { sudo timeout 10m apt-get install -y -o Acquire::Retries=3 -o Dir::Cache::archives="$HOME/apt-archives" flatpak flatpak-builder ostree gnupg; }
          install || { sudo timeout 10m apt-get update && install; }
          sudo chown -R "$USER" ~/apt-archives
      # saved when the install fails too: the mirror of x64 is slow at times, and the next run continues with the packages that were downloaded
      - name: Keep the packaging tools
        if: always() && matrix.package == 'flatpak' && steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-flatpak-${{ matrix.arch }}-${{ github.run_id }}
      # electron-builder bundles the flatpak from the runtime, the sdk and the base app, which it does not download itself
      - name: Install the Flatpak runtime
        if: matrix.package == 'flatpak'
        timeout-minutes: 15
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08 org.electronjs.Electron2.BaseApp//25.08
      # the prebuilt sqlite3 is built on a newer system and needs glibc 2.38; compiled here it needs what 22.04 has (checked by npm run check:dist)
      # it goes into the environment for the later steps (the install and the rebuild of electron-builder), and not as a value of the job: an empty value would count as set
      - name: Compile the native modules
        if: matrix.package == 'appimage'
        run: echo "npm_config_build_from_source=true" >> "$GITHUB_ENV"
      - uses: ./.github/actions/install-dependencies
        with:
          fresh: ${{ inputs.version != '' }}
      - name: Set the version of the release
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_SUMMARY: ${{ inputs.notes }}
        # the default shell of Windows is PowerShell, where "$VERSION" is empty and the installer would keep the version of package.json
        shell: bash
        run: node scripts/release/version.js "$VERSION"
      # package.json (extraResources) packages it with its notice and license, and the packaging step fails without it
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ffmpeg-${{ matrix.platform }}-${{ matrix.arch }}
          path: .cache/ffmpeg/install/bin
      # the artifact does not keep the executable bit
      - name: Make ffmpeg executable
        if: runner.os != 'Windows'
        run: chmod +x .cache/ffmpeg/install/bin/*
      - run: npm run build
      - run: npm run dist
      # the update information in the AppImage names it (scripts/release/appimage-update-info.js); AppImageUpdate and appimageupdatetool, which AM runs, download only what changed with it
      - name: Make the zsync file of the AppImage
        if: matrix.package == 'appimage'
        run: |
          install() { sudo timeout 10m apt-get install -y -o Acquire::Retries=3 zsync; }
          install || { sudo timeout 10m apt-get update && install; }
          node scripts/release/zsync.js
      - name: Check the contents of the package
        run: npm run check:dist
      # the packaged app has to start: a file missing from the package or a native module that does not load only shows here
      - name: Smoke test of the packaged app
        if: runner.os != 'Linux'
        run: npm run smoke:packaged
      # the own updater of macOS replaces the bundle it runs from: it installs a signed update and refuses the others, on the packaged app of this runner
      - name: Update test of the packaged app (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 30
        run: npm run test:updater
      - name: Smoke test of the packaged app (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run smoke:packaged
      # the sandbox, the finish args and the zypak wrapper of the bundle only show when the installed flatpak starts
      - name: Smoke test of the Flatpak bundle
        if: matrix.package == 'flatpak'
        run: |
          flatpak install --user --noninteractive --bundle dist/Tunelle-*.flatpak
          xvfb-run --auto-servernum dbus-run-session npm run smoke:flatpak
      # the repository that is published after a release is built from this bundle with a key of this run: it has to install the app and start it
      - name: Smoke test of the Flatpak repository
        if: matrix.package == 'flatpak'
        run: |
          export GNUPGHOME="$(mktemp -d)"
          gpg --batch --passphrase '' --quick-generate-key 'Tunelle test <test@example.com>' default default 1d
          export FLATPAK_GPG_PRIVATE_KEY="$(gpg --armor --export-secret-keys)"
          gpg --export > "$RUNNER_TEMP/test-key.gpg"
          node scripts/release/flatpak-repo.js dist "$RUNNER_TEMP/flatpak-repo"
          # the metainfo is what the software centre shows (icon, description, screenshots): the bundle has to carry it
          ostree ls --repo="$RUNNER_TEMP/flatpak-repo" "app/io.github.koeroesi86.Tunelle/$(flatpak --default-arch)/stable" /files/share/metainfo/io.github.koeroesi86.Tunelle.metainfo.xml
          flatpak uninstall --user --noninteractive io.github.koeroesi86.Tunelle
          flatpak remote-add --user --gpg-import="$RUNNER_TEMP/test-key.gpg" tunelle-test "file://$RUNNER_TEMP/flatpak-repo"
          flatpak install --user --noninteractive tunelle-test io.github.koeroesi86.Tunelle
          xvfb-run --auto-servernum dbus-run-session npm run smoke:flatpak
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ env.DIST_ID }}
          path: |
            dist/Tunelle*
            dist/*.yml
            !dist/builder-debug.yml
          if-no-files-found: error

  # the tests of Partner Center on the package for the Store, and that it does not look for updates on GitHub; a failure stops a release as well
  certification:
    name: Store certification
    needs: dist
    uses: ./.github/workflows/wack.yml
    with:
      artifact: dist-win32-x64
    permissions:
      contents: read

  # the kit is not on the arm64 runner: the Store package of that processor is installed and started, and must not look for updates on GitHub; a failure stops a release as well
  certification-arm64:
    name: Store certification (arm64)
    needs: dist
    uses: ./.github/workflows/wack.yml
    with:
      artifact: dist-win32-arm64
      arch: arm64
    permissions:
      contents: read
