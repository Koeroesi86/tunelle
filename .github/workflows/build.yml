name: Build

on:
  push:
    branches: [master]

permissions:
  # a called workflow gets at most what its caller has: ffmpeg.yml lists the caches (docs/development/ffmpeg-build.md)
  actions: read
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  dist:
    needs: test
    uses: ./.github/workflows/dist.yml
